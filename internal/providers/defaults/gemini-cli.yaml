id: gemini-cli
display:
  name: Gemini CLI
  color: "#4285F4"
  website: "https://github.com/google-gemini/gemini-cli"
category: oauth
priority: 20
aliases: [gc]
transport:
  base_url: "https://cloudcode-pa.googleapis.com"
  format: gemini
  auth: bearer
executor: gemini-cli
capabilities: [chat]
# Cloud Code Assist has no /models route, and this account type is licensed per
# user: Google answers the model listing with 403 for accounts without a valid
# Gemini CLI license. The preset is therefore the fallback catalog, and it lists
# the ids the CLI itself ships (packages/core/src/config/models.ts, VALID_GEMINI_MODELS)
# so a sync never leaves the provider with an empty catalog.
models:
  - id: gemini-3.1-pro-preview
    name: Gemini 3.1 Pro (Preview)
  - id: gemini-3-pro-preview
    name: Gemini 3 Pro (Preview)
  - id: gemini-3-flash-preview
    name: Gemini 3 Flash (Preview)
  - id: gemini-3.1-flash-lite-preview
    name: Gemini 3.1 Flash Lite (Preview)
  - id: gemini-2.5-pro
    name: Gemini 2.5 Pro
  - id: gemini-2.5-flash
    name: Gemini 2.5 Flash
  - id: gemini-2.5-flash-lite
    name: Gemini 2.5 Flash Lite
